# Local development infrastructure.
#   docker compose up -d db              -> Postgres + pgvector only (run API/web natively)
#   docker compose --profile full up     -> also runs the API container (prod-like)
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: support
      POSTGRES_PASSWORD: support
      POSTGRES_DB: support
    ports:
      - "55432:5432" # high port: avoids a local Postgres and Windows/Hyper-V reserved ranges
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support -d support"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    profiles: ["full"]
    build:
      context: ./apps/api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://support:support@db:5432/support
      ENV: production
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
